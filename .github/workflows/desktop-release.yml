name: Build and Release Desktop Client

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
          - platform: 'windows-latest'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm install
        working-directory: desktop

      - name: Set version from release tag
        shell: bash
        run: npm pkg set version=${TAG#v}
        working-directory: desktop
        env:
          TAG: ${{ github.event.release.tag_name }}

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Baked in at compile time (Rust's option_env! / Vite's import.meta.env) so the
          # released binary talks to production instead of the localhost dev defaults.
          DJCLOUD_API_URL: https://djcloud.cloud
          VITE_WEB_LOGIN_URL: https://djcloud.cloud/login?desktop=1
        with:
          projectPath: desktop
          tagName: ${{ github.event.release.tag_name }}
          releaseId: ${{ github.event.release.id }}