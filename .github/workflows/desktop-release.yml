name: Build and Release Desktop Client

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
          - platform: 'windows-latest'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm install
        working-directory: desktop

      - name: Set version from release tag
        shell: bash
        run: npm pkg set version=${TAG#v}
        working-directory: desktop
        env:
          TAG: ${{ github.event.release.tag_name }}

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          tagName: ${{ github.event.release.tag_name }}
          releaseId: ${{ github.event.release.id }}

      # tauri-action names the MSI "..._x64_en-US.msi" (WiX's locale suffix).
      # Add a friendlier "-setup.msi" copy for human downloaders. The original
      # "_en-US.msi" asset must NOT be deleted/renamed: the updater's
      # latest.json (generated by tauri-action above) records its download URL
      # against that exact original filename, so removing it would break
      # auto-update for anyone on the updater.
      - name: Add -setup-named MSI copy for manual downloads
        if: matrix.platform == 'windows-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          cd "desktop/src-tauri/target/release/bundle/msi"
          for f in *_en-US.msi; do
            new="${f/_en-US.msi/-setup.msi}"
            cp "$f" "$new"
            gh release upload "${{ github.event.release.tag_name }}" "$new" --clobber
          done